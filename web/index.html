<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">
    <meta name="description" content="JARVIS INFINITY yapay zekâ asistanı">
    <title>JARVIS INFINITY</title>

    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="app-container">

        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">J</div>
                <div>
                    <h1>JARVIS INFINITY</h1>
                    <span>Yapay Zekâ Asistanı</span>
                </div>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                Sistem
            </div>
        </header>

        <main>

            <section id="auth-section" class="auth-card">
                <h2>JARVIS'e Hoş Geldin</h2>
                <p>Devam etmek için giriş yap veya hesap oluştur.</p>

                <div class="auth-tabs">
                    <button id="login-tab" class="active" type="button">
                        Giriş Yap
                    </button>
                    <button id="register-tab" type="button">
                        Kayıt Ol
                    </button>
                </div>

                <form id="auth-form">
                    <label for="email">E-posta</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="ornek@email.com"
                        required
                    >

                    <label for="password">Şifre</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="En az 10 karakter"
                        minlength="10"
                        required
                    >

                    <button id="auth-submit" class="primary-btn" type="submit">
                        Giriş Yap
                    </button>
                </form>

                <p id="auth-message" class="message"></p>
            </section>

            <section id="chat-section" hidden>

                <div class="user-bar">
                    <span id="user-email"></span>
                    <button id="logout-btn" type="button">
                        Çıkış Yap
                    </button>
                </div>

                <div class="welcome">
                    <div class="welcome-logo">J</div>
                    <h2>Ben JARVIS INFINITY</h2>
                    <p>Nasıl yardımcı olabilirim?</p>
                </div>

                <div id="chat-messages" class="chat-messages">
                    <div class="assistant-message">
                        Merhaba! Ben JARVIS INFINITY. Sana nasıl yardımcı
                        olabilirim?
                    </div>
                </div>

                <form id="chat-form" class="chat-form">
                    <textarea
                        id="message-input"
                        placeholder="JARVIS'e bir mesaj yaz..."
                        rows="1"
                        required
                    ></textarea>

                    <button id="send-btn" type="submit">
                        Gönder
                    </button>
                </form>

                <p id="chat-status" class="message"></p>

                <section class="memory-section">
                    <h3>JARVIS Hafızası</h3>

                    <form id="memory-form">
                        <input
                            id="memory-title"
                            type="text"
                            placeholder="Hafıza başlığı"
                            required
                        >

                        <textarea
                            id="memory-content"
                            placeholder="JARVIS'in hatırlamasını istediğin bilgi..."
                            required
                        ></textarea>

                        <button type="submit">Hafızaya Kaydet</button>
                    </form>

                    <div id="memory-list"></div>
                </section>

            </section>

        </main>

        <footer>
            <p>JARVIS INFINITY © 2026</p>
        </footer>

    </div>

    <script src="/static/app.js"></script>
</body>
    </html>
